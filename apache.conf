<VirtualHost *:80>
    ServerName amigpl.com
    ServerAlias www.amigpl.com
    DocumentRoot /www/wwwroot/amigpl.com
    
    <Directory /www/wwwroot/amigpl.com>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    ErrorLog /www/wwwlogs/amigpl.com.error.log
    CustomLog /www/wwwlogs/amigpl.com.log combined
</VirtualHost>










