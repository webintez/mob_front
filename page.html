    <style>
        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            /* padding: 40px 0px 0px 0px; */
            min-height: 60vh;
        }

        .page-header {
            background: linear-gradient(135deg, #011C08 0%, #0a4409 100%);
            color: white;
            padding: 60px 20px !important;
            text-align: center;
            margin-bottom: 40px;
            min-height: 150px !important;
            height: auto !important;
            display: flex !important;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: visible !important;
        }

        .page-header h1 {
            font-size: 42px !important;
            margin: 0 !important;
            padding: 0 !important;
            color: white !important;
            font-weight: 600 !important;
            text-align: center !important;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            width: 100% !important;
            line-height: 1.2 !important;
        }

        .page-header .loading-container {
            display: none;
        }

        .page-content {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            line-height: 1.8;
        }

        .page-content h2 {
            color: #0a4409;
            font-size: 28px;
            margin: 30px 0 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f7a200;
        }

        .page-content h3 {
            color: #0a4409;
            font-size: 22px;
            margin: 25px 0 15px;
        }

        .page-content h4 {
            color: #0a4409;
            font-size: 18px;
            margin: 20px 0 10px;
        }

        .page-content p {
            margin-bottom: 15px;
            color: #555;
        }

        .page-content ul,
        .page-content ol {
            margin: 20px 0;
            padding-left: 30px;
        }

        .page-content li {
            margin-bottom: 10px;
            color: #555;
        }

        .page-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 20px 0;
        }

        .page-content a {
            color: #0a4409;
            text-decoration: none;
            font-weight: 600;
        }

        .page-content a:hover {
            color: #f7a200;
            text-decoration: underline;
        }

        .page-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .page-content table th,
        .page-content table td {
            padding: 12px;
            border: 1px solid #e0e0e0;
            text-align: left;
        }

        .page-content table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #0a4409;
        }

        .page-content blockquote {
            border-left: 4px solid #f7a200;
            padding-left: 20px;
            margin: 20px 0;
            color: #666;
            font-style: italic;
        }

        .page-content .table-wrapper {
            overflow-x: auto;
            margin: 20px 0;
            -webkit-overflow-scrolling: touch;
        }

        .page-content .table-wrapper table {
            min-width: 100%;
        }

        .page-content .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            margin: 20px 0;
        }

        .page-content .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .page-content pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 20px 0;
            border-left: 4px solid #0a4409;
        }

        .page-content code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .page-content pre code {
            background: transparent;
            padding: 0;
        }

        .page-content hr {
            border: none;
            border-top: 2px solid #e0e0e0;
            margin: 30px 0;
        }

        .page-content strong,
        .page-content b {
            font-weight: 600;
            color: #333;
        }

        .page-content em,
        .page-content i {
            font-style: italic;
        }

        .loading-container {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0a4409;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error-container {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .error-container i {
            font-size: 64px;
            color: #f44336;
            margin-bottom: 20px;
        }

        .error-container h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0a4409;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 20px;
            border: 2px solid #0a4409;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: #0a4409;
            color: white;
        }

        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 28px;
            }

            .page-content {
                padding: 20px;
            }

            #page-header {
                display: none !important;
            }
        }
    </style>
