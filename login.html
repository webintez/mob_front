<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.png" type="image/png">
    <title>Login - Mobitez Private Limited</title>
    <link rel="stylesheet" href="/css/style.css?v=branding_fix_v11">
    <link rel="stylesheet" href="/css/login.css?v=1773128053">
    <link rel="stylesheet" href="/css/mobile-responsive.css?v=1773128053">
    <link rel="stylesheet" href="/css/mobitez-mobile-style.css?v=branding_fix_v11">
    <!-- CRITICAL: Mobile header consistency - MUST load LAST -->
    <link rel="stylesheet" href="/css/mobile-header-consistent.css?v=branding_fix_v11">
    <link rel="stylesheet" href="/css/mobitez-mobile-header.css?v=1773128053">

    <link rel="stylesheet" href="/css/secondary-menu.css?v=1773128053">
    <link rel="stylesheet" href="/css/nav-menu-visible.css?v=fixed_nav">
    <link rel="stylesheet" href="/css/mobitez-dropdown.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/js/secondary-menu.js?v=1773128102" defer></script>
</head>

<body>
    <!-- Header -->
    <header id="header-container"></header>

    <!-- Navigation Menu (Added for consistency) -->
    <nav class="nav-menu">
        <div class="nav-container" id="navContainer">
            <!-- Categories will be loaded dynamically -->
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" style="padding-top: 100px !important;">
        <div class="container login-container">
            <div class="login-wrapper">

                <!-- Step 1: Phone Number -->
                <div class="phone-form-section" id="phoneFormSection">
                    <h2 class="login-title">Login</h2>
                    <p class="login-subtitle">Get access to your Orders, Wishlist and Recommendations</p>

                    <form id="phoneForm" class="auth-form">
                        <div class="form-group">
                            <div class="mobile-input-wrapper">
                                <span class="country-code">+91</span>
                                <input type="tel" id="phoneInput" class="form-input mobile-input"
                                    placeholder="Enter Mobile Number" maxlength="10" pattern="[6-9][0-9]{9}"
                                    inputmode="numeric" autocomplete="tel" required>
                            </div>
                            <span class="form-error" id="phoneError"></span>
                        </div>

                        <button type="submit" class="btn-primary" id="sendOTPBtn">
                            <i class="fas fa-paper-plane"></i> Send OTP
                        </button>
                    </form>

                    <div class="signup-link">
                        <p>New to Mobitez Private Limited? <a href="/signup.html">Create an account</a></p>
                    </div>
                </div>

                <!-- Step 2: OTP Verification -->
                <div class="otp-form-section" id="otpFormSection" style="display: none;">
                    <button type="button" class="back-btn" id="backBtn">
                        <i class="fas fa-arrow-left"></i> Back
                    </button>

                    <h2 class="login-title">Verify OTP</h2>
                    <p class="login-subtitle">
                        Enter the 6-digit OTP sent to<br>
                        <strong id="displayPhone">+91 9674983383</strong>
                    </p>

                    <form id="otpForm" class="auth-form">
                        <div class="form-group">
                            <div class="otp-input-container">
                                <input type="text" class="otp-digit" maxlength="1" inputmode="numeric"
                                    autocomplete="off">
                                <input type="text" class="otp-digit" maxlength="1" inputmode="numeric"
                                    autocomplete="off">
                                <input type="text" class="otp-digit" maxlength="1" inputmode="numeric"
                                    autocomplete="off">
                                <input type="text" class="otp-digit" maxlength="1" inputmode="numeric"
                                    autocomplete="off">
                                <input type="text" class="otp-digit" maxlength="1" inputmode="numeric"
                                    autocomplete="off">
                                <input type="text" class="otp-digit" maxlength="1" inputmode="numeric"
                                    autocomplete="off">
                            </div>
                            <span class="form-error" id="otpError"></span>
                        </div>

                        <div class="otp-timer">
                            OTP expires in <strong id="otpCountdown">05:00</strong>
                        </div>

                        <button type="submit" class="btn-primary" id="verifyOTPBtn">
                            <i class="fas fa-check-circle"></i> Verify & Login
                        </button>

                        <div class="resend-otp">
                            <p>Didn't receive OTP?
                                <button type="button" class="resend-btn" id="resendOTPBtn" disabled>
                                    Resend OTP
                                </button>
                            </p>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <div id="notificationContainer"></div>

    <script src="/js/auth.js?v=1773128102"></script>
    <script src="/js/cart-api.js?v=1773128102"></script>
    <script src="/js/header-common.js?v=1773128102"></script>
    <script src="/js/search-common.js?v=1773128102"></script>
    <script src="/js/category-nav-common.js?v=1773128102"></script>
    <script src="/js/mobile-menu.js?v=1773128102"></script>
    <script src="/js/mobitez-mobile-header.js?v=1773128102"></script>
    <script src="/js/login.js?v=1773128102"></script>



    <!-- Footer loaded dynamically -->
    <script src="/js/footer-common.js?v=1773128102"></script>
</body>

</html>
