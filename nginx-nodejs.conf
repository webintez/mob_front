# Nginx configuration for Node.js reverse proxy
# Update your existing nginx.conf or add this to your server block

server {
    listen 80;
    listen [::]:80;
    
    server_name amigpl.com www.amigpl.com;
    
    # Proxy to Node.js application
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Optional: Serve static files directly from nginx for better performance
    # location /static/ {
    #     alias /home/webintez/amigpl.com/public/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }
    
    access_log /www/wwwlogs/amigpl.com.log;
    error_log /www/wwwlogs/amigpl.com.error.log;
}

