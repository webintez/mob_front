    <style>
        .flash-sale-banner {
            background: linear-gradient(135deg, #ff3e6c, #ff6a00);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .flash-sale-banner h1 {
            margin: 0;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .flash-sale-timer {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        /* Make grid span full width without sidebar */
        .search-container-wrapper {
            display: block !important;
            max-width: 100% !important;
            padding: 0 !important;
        }
        .search-results {
            width: 100% !important;
            border-radius: 0 !important;
        }

        /* Mega Card Styles */
        .products-grid {
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) !important;
            gap: 30px !important;
            padding: 20px;
        }

        .mega-card {
            width: 100%;
            max-width: 310px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 18px;
            padding: 15px;
            position: relative;
            overflow: hidden;
            border: 3px solid #ff5a00;
            box-shadow: 0 0 35px rgba(255,90,0,0.35);
            animation: megaShake 2.5s infinite;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .mega-card::after {
            content: "FLASH SALE";
            position: absolute;
            top: 6px;
            left: -45px;
            width: 160px;
            background: #111827;
            color: white;
            text-align: center;
            padding: 8px 0;
            font-size: 11px;
            font-weight: 900;
            transform: rotate(-35deg);
            letter-spacing: 1px;
            z-index: 5;
        }

        .offer-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff3366, #ff5a00);
            color: #fff;
            padding: 9px 11px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 900;
            z-index: 6;
            box-shadow: 0 0 20px rgba(255,51,102,0.7);
            animation: badgeBoom 0.7s infinite alternate;
        }

        .mega-product-img {
            height: 215px;
            background: radial-gradient(circle, #fff0e6, #ffffff);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mega-product-img img {
            max-width: 88%;
            max-height: 190px;
            animation: productFloat 2s infinite alternate;
        }

        .mega-product-name {
            margin: 16px 0;
            font-size: 15px;
            line-height: 1.4;
            font-weight: 700;
            color: #111827;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price-line {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 12px;
        }

        .main-price {
            font-size: 36px;
            font-weight: 900;
            color: #ff5a00;
            animation: priceFire 0.65s infinite alternate;
        }

        .cut-price {
            color: #888;
            text-decoration: line-through;
            font-size: 16px;
        }

        .mega-timer {
            background: #111827;
            color: #fff;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            display: inline-block;
            margin-bottom: 12px;
            text-align: center;
        }

        .buy-btn {
            width: 100%;
            border: none;
            background: linear-gradient(135deg, #ff5a00, #e64600);
            color: #fff;
            padding: 13px;
            border-radius: 10px;
            font-weight: 900;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 12px 25px rgba(255,90,0,0.4);
            animation: buttonPulse 1s infinite alternate;
            text-align: center;
            box-sizing: border-box;
        }

        @keyframes productFloat {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-8px) scale(1.05); }
        }

        @keyframes badgeBoom {
            from { transform: scale(1); }
            to { transform: scale(1.13) rotate(-3deg); }
        }

        @keyframes priceFire {
            from { transform: scale(1); text-shadow: 0 0 8px rgba(255,90,0,0.4); }
            to { transform: scale(1.16); text-shadow: 0 0 28px rgba(255,90,0,0.9); }
        }

        @keyframes buttonPulse {
            from { transform: scale(1); }
            to { transform: scale(1.04); }
        }

        @keyframes megaShake {
            0%, 100% { transform: rotate(0deg); }
            96% { transform: rotate(0deg); }
            97% { transform: rotate(1deg); }
            98% { transform: rotate(-1deg); }
            99% { transform: rotate(1deg); }
        }
    </style>
</head>
